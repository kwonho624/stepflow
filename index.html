<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a2e">
<title>StepFlow</title>
<style>
  :root {
    --primary: #4f6ef7;
    --primary-light: #e8ecff;
    --success: #22c55e;
    --success-light: #dcfce7;
    --warning: #f59e0b;
    --warning-light: #fef3c7;
    --danger: #ef4444;
    --danger-light: #fee2e2;
    --gray: #6b7280;
    --gray-light: #f3f4f6;
    --text: #111827;
    --text-sub: #6b7280;
    --border: #e5e7eb;
    --bg: #f9fafb;
    --card: #ffffff;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* 화면 전환 */
  .screen { display: none; flex-direction: column; min-height: 100vh; }
  .screen.active { display: flex; }

  /* 로그인 */
  .login-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; background: linear-gradient(160deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%); }
  .login-logo { font-size: 28px; font-weight: 700; color: #fff; letter-spacing: -0.5px; margin-bottom: 4px; }
  .login-logo span { color: var(--primary); }
  .login-sub { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 40px; }
  .login-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; }
  .login-label { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 6px; letter-spacing: 0.5px; }
  .login-input { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: var(--radius-sm); font-size: 16px; color: #fff; margin-bottom: 16px; outline: none; }
  .login-input::placeholder { color: rgba(255,255,255,0.3); }
  .login-input:focus { border-color: var(--primary); }
  .login-btn { width: 100%; padding: 14px; background: var(--primary); border: none; border-radius: var(--radius-sm); font-size: 16px; font-weight: 600; color: #fff; cursor: pointer; margin-top: 4px; }
  .login-btn:active { opacity: 0.85; }
  .login-error { font-size: 13px; color: #fc8181; margin-top: 10px; text-align: center; display: none; }

  /* 상단바 */
  .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .topbar-left h1 { font-size: 17px; font-weight: 700; color: var(--text); }
  .topbar-left p { font-size: 12px; color: var(--text-sub); margin-top: 1px; }
  .topbar-right { display: flex; gap: 8px; align-items: center; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--gray-light); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .icon-btn:active { opacity: 0.7; }

  /* 콘텐츠 */
  .content { flex: 1; padding: 16px; overflow-y: auto; padding-bottom: 80px; }

  /* 탭바 */
  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; padding: 8px 0 env(safe-area-inset-bottom, 8px); z-index: 20; }
  .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 0; }
  .tab-item .icon { font-size: 22px; color: var(--text-sub); }
  .tab-item .label { font-size: 10px; color: var(--text-sub); }
  .tab-item.active .icon, .tab-item.active .label { color: var(--primary); }

  /* 필터 */
  .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar { display: none; }
  .chip { white-space: nowrap; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; border: 1px solid var(--border); background: var(--card); color: var(--text-sub); cursor: pointer; }
  .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  /* 업무 카드 */
  .task-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; cursor: pointer; transition: box-shadow 0.15s; }
  .task-card:active { box-shadow: 0 0 0 2px var(--primary); }
  .task-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
  .task-name { font-size: 15px; font-weight: 600; color: var(--text); flex: 1; margin-right: 8px; }
  .task-detail { font-size: 13px; color: var(--text-sub); margin-bottom: 8px; }
  .task-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .meta-item { font-size: 12px; color: var(--text-sub); display: flex; align-items: center; gap: 3px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
  .badge-wait { background: var(--gray-light); color: var(--gray); }
  .badge-active { background: var(--primary-light); color: var(--primary); }
  .badge-done { background: var(--success-light); color: var(--success); }
  .badge-pause { background: var(--warning-light); color: var(--warning); }
  .owner-badge { font-size: 11px; background: #f0f0ff; color: var(--primary); padding: 2px 8px; border-radius: 20px; font-weight: 500; }

  /* 통계 카드 */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .stat-label { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
  .stat-val { font-size: 26px; font-weight: 700; color: var(--text); }
  .stat-box.blue .stat-val { color: var(--primary); }
  .stat-box.green .stat-val { color: var(--success); }
  .stat-box.yellow .stat-val { color: var(--warning); }

  /* 섹션 타이틀 */
  .section-title { font-size: 13px; font-weight: 600; color: var(--text-sub); margin: 16px 0 10px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* 모달 */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: flex-end; z-index: 100; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--card); border-radius: 20px 20px 0 0; padding: 20px; width: 100%; max-height: 85vh; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom, 20px); }
  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .modal-sub { font-size: 13px; color: var(--text-sub); margin-bottom: 16px; }
  .modal-info { background: var(--gray-light); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 16px; font-size: 13px; color: var(--text-sub); line-height: 1.6; }
  .form-label { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
  .form-input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; color: var(--text); background: var(--card); outline: none; margin-bottom: 14px; }
  .form-input:focus { border-color: var(--primary); }
  .action-btn { width: 100%; padding: 14px; border-radius: var(--radius-sm); font-size: 16px; font-weight: 600; cursor: pointer; border: none; margin-bottom: 8px; }
  .btn-start { background: var(--primary); color: #fff; }
  .btn-done { background: var(--success); color: #fff; }
  .btn-pause { background: var(--warning-light); color: var(--warning); border: 1px solid var(--warning); }
  .btn-close { background: var(--gray-light); color: var(--text-sub); }
  .action-btn:active { opacity: 0.8; }

  /* 로딩 */
  .loading { text-align: center; padding: 40px; color: var(--text-sub); font-size: 14px; }
  .empty { text-align: center; padding: 48px 24px; color: var(--text-sub); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty p { font-size: 14px; }

  /* 담당자 카드 */
  .owner-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .owner-name { font-size: 15px; font-weight: 600; }
  .owner-stats-text { font-size: 13px; color: var(--text-sub); }
  .progress-bar { height: 4px; background: var(--gray-light); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--success); border-radius: 2px; transition: width 0.3s; }

  /* 새로고침 버튼 */
  .refresh-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--primary); background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 12px; }
</style>
</head>
<body>

<!-- ===== 로그인 화면 ===== -->
<div id="screen-login" class="screen active">
  <div class="login-wrap">
    <div class="login-logo">Step<span>Flow</span></div>
    <div class="login-sub">생산성 관리 시스템</div>
    <div class="login-card">
      <div class="login-label">이름</div>
      <input id="inp-name" class="login-input" type="text" placeholder="이름 입력" autocomplete="off" />
      <div class="login-label">핀번호</div>
      <input id="inp-pin" class="login-input" type="password" placeholder="핀번호 입력" inputmode="numeric" />
      <button class="login-btn" onclick="doLogin()">로그인</button>
      <div id="login-error" class="login-error"></div>
    </div>
  </div>
</div>

<!-- ===== 메인 화면 ===== -->
<div id="screen-main" class="screen">
  <div class="topbar">
    <div class="topbar-left">
      <h1>StepFlow</h1>
      <p id="top-user-label"></p>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" onclick="loadTasks()" title="새로고침">🔄</button>
      <button class="icon-btn" onclick="doLogout()" title="로그아웃">🚪</button>
    </div>
  </div>

  <!-- 업무 탭 -->
  <div id="tab-tasks" class="content">
    <div class="filter-row">
      <div class="chip active" onclick="filterTasks('전체',this)">전체</div>
      <div class="chip" onclick="filterTasks('대기',this)">대기</div>
      <div class="chip" onclick="filterTasks('진행',this)">진행중</div>
      <div class="chip" onclick="filterTasks('일시정지',this)">일시정지</div>
      <div class="chip" onclick="filterTasks('완료',this)">완료</div>
    </div>
    <div id="task-list"><div class="loading">불러오는 중...</div></div>
  </div>

  <!-- 대시보드 탭 -->
  <div id="tab-dashboard" class="content" style="display:none">
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-label">전체 업무</div><div class="stat-val" id="s-total">—</div></div>
      <div class="stat-box blue"><div class="stat-label">진행중</div><div class="stat-val" id="s-active">—</div></div>
      <div class="stat-box green"><div class="stat-label">완료</div><div class="stat-val" id="s-done">—</div></div>
      <div class="stat-box"><div class="stat-label">대기</div><div class="stat-val" id="s-wait">—</div></div>
    </div>
    <div class="section-title">담당자별 현황</div>
    <div id="owner-list"></div>
  </div>

  <!-- 하단 탭바 -->
  <div class="tabbar">
    <div class="tab-item active" id="tab-btn-tasks" onclick="switchTab('tasks')">
      <span class="icon">📋</span>
      <span class="label">업무목록</span>
    </div>
    <div class="tab-item" id="tab-btn-dashboard" onclick="switchTab('dashboard')">
      <span class="icon">📊</span>
      <span class="label">대시보드</span>
    </div>
  </div>
</div>

<!-- ===== 업무 상세 모달 ===== -->
<div id="modal-bg" class="modal-bg" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="m-name"></div>
    <div class="modal-sub" id="m-detail"></div>
    <div class="modal-info" id="m-info"></div>
    <div id="m-quantity-wrap" style="display:none">
      <div class="form-label">수량</div>
      <input id="m-quantity" class="form-input" type="number" placeholder="처리 수량 입력" inputmode="numeric" />
    </div>
    <div class="form-label">비고 (선택)</div>
    <input id="m-memo" class="form-input" type="text" placeholder="메모 입력" />
    <div id="m-actions"></div>
    <button class="action-btn btn-close" onclick="closeModal()">닫기</button>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyRwjLSmzG1rO0szJuwOIMMAKNQ0vthpPBl9DnQGRSflgkzu363_EwdvXoVPst4ut0B/exec';
let user = null;
let tasks = [];
let currentFilter = '전체';
let currentTaskId = null;

// ===== 로그인 =====
function doLogin() {
  const name = document.getElementById('inp-name').value.trim();
  const pin  = document.getElementById('inp-pin').value.trim();
  const err  = document.getElementById('login-error');
  if (!name || !pin) { showErr(err, '이름과 핀번호를 입력하세요.'); return; }
  err.style.display = 'none';
  document.querySelector('.login-btn').textContent = '로그인 중...';
  fetch(`${API}?action=login&name=${enc(name)}&pin=${enc(pin)}`)
    .then(r => r.json())
    .then(d => {
      document.querySelector('.login-btn').textContent = '로그인';
      if (d.success) {
        user = d;
        document.getElementById('top-user-label').textContent = d.role === '관리자' ? `${d.name} · 관리자` : d.name;
        show('screen-main'); hide('screen-login');
        loadTasks();
      } else showErr(err, d.message || '로그인 실패');
    })
    .catch(() => { document.querySelector('.login-btn').textContent = '로그인'; showErr(err, '서버 연결 오류'); });
}

function doLogout() {
  if (!confirm('로그아웃 하시겠습니까?')) return;
  user = null; tasks = [];
  show('screen-login'); hide('screen-main');
  document.getElementById('inp-pin').value = '';
}

// ===== 업무 로드 =====
function loadTasks() {
  document.getElementById('task-list').innerHTML = '<div class="loading">불러오는 중...</div>';
  fetch(`${API}?action=getTasks&name=${enc(user.name)}&role=${enc(user.role)}`)
    .then(r => r.json())
    .then(d => {
      if (d.success) { tasks = d.tasks; renderTasks(); updateDashboard(); }
      else document.getElementById('task-list').innerHTML = `<div class="loading">${d.message}</div>`;
    })
    .catch(() => { document.getElementById('task-list').innerHTML = '<div class="loading">서버 연결 오류</div>'; });
}

function renderTasks() {
  const list = document.getElementById('task-list');
  const filtered = currentFilter === '전체' ? tasks : tasks.filter(t => t.status === currentFilter);
  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><p>해당 업무가 없습니다.</p></div>`;
    return;
  }
  list.innerHTML = filtered.map(t => `
    <div class="task-card" onclick="openModal('${t.taskId}')">
      <div class="task-top">
        <div class="task-name">${t.taskName}</div>
        <span class="badge ${badgeClass(t.status)}">${t.status || '대기'}</span>
      </div>
      <div class="task-detail">${t.detail || ''}</div>
      <div class="task-meta">
        ${user.role === '관리자' ? `<span class="owner-badge">${t.owner}</span>` : ''}
        ${t.quantity ? `<span class="meta-item">📦 ${t.quantity}</span>` : ''}
        ${t.accumulated ? `<span class="meta-item">⏱ ${t.accumulated}h</span>` : ''}
        ${t.startTime ? `<span class="meta-item">▶ ${t.startTime}</span>` : ''}
      </div>
    </div>`).join('');
}

function badgeClass(s) {
  if (s === '진행') return 'badge-active';
  if (s === '완료') return 'badge-done';
  if (s === '일시정지') return 'badge-pause';
  return 'badge-wait';
}

function filterTasks(f, el) {
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

// ===== 모달 =====
function openModal(taskId) {
  currentTaskId = taskId;
  const t = tasks.find(x => String(x.taskId) === String(taskId));
  if (!t) return;
  document.getElementById('m-name').textContent = t.taskName;
  document.getElementById('m-detail').textContent = t.detail || '';
  let info = `담당자: ${t.owner}`;
  if (t.startTime) info += `\n시작: ${t.startTime}`;
  if (t.endTime) info += `\n종료: ${t.endTime}`;
  if (t.accumulated) info += `\n누적 작업시간: ${t.accumulated}h`;
  if (t.quantity) info += `\n수량: ${t.quantity}`;
  document.getElementById('m-info').style.whiteSpace = 'pre-line';
  document.getElementById('m-info').textContent = info;
  document.getElementById('m-memo').value = t.memo || '';
  document.getElementById('m-quantity').value = '';
  const qw = document.getElementById('m-quantity-wrap');
  const actions = document.getElementById('m-actions');
  const s = t.status || '대기';
  if (s === '대기' || s === '일시정지') {
    qw.style.display = 'none';
    actions.innerHTML = `<button class="action-btn btn-start" onclick="doStart()">▶ 업무 시작</button>`;
  } else if (s === '진행') {
    qw.style.display = 'block';
    actions.innerHTML = `
      <button class="action-btn btn-done" onclick="doEnd()">✅ 완료</button>
      <button class="action-btn btn-pause" onclick="doPause()">⏸ 일시정지</button>`;
  } else {
    qw.style.display = 'none';
    actions.innerHTML = `<div style="text-align:center;padding:8px 0;font-size:14px;color:var(--text-sub)">완료된 업무입니다.</div>`;
  }
  document.getElementById('modal-bg').classList.add('open');
}

function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }
function closeModalOutside(e) { if (e.target === document.getElementById('modal-bg')) closeModal(); }

// ===== 업무 액션 =====
function doStart() {
  setActionLoading(true);
  fetch(API, { method: 'POST', body: JSON.stringify({ action: 'startTask', taskId: currentTaskId }) })
    .then(r => r.json())
    .then(d => { setActionLoading(false); if (d.success) { closeModal(); loadTasks(); } else alert(d.message); })
    .catch(() => { setActionLoading(false); alert('서버 오류'); });
}

function doEnd() {
  const qty = document.getElementById('m-quantity').value;
  const memo = document.getElementById('m-memo').value;
  setActionLoading(true);
  fetch(API, { method: 'POST', body: JSON.stringify({ action: 'endTask', taskId: currentTaskId, quantity: qty, memo }) })
    .then(r => r.json())
    .then(d => { setActionLoading(false); if (d.success) { closeModal(); loadTasks(); } else alert(d.message); })
    .catch(() => { setActionLoading(false); alert('서버 오류'); });
}

function doPause() {
  setActionLoading(true);
  fetch(API, { method: 'POST', body: JSON.stringify({ action: 'pauseTask', taskId: currentTaskId }) })
    .then(r => r.json())
    .then(d => { setActionLoading(false); if (d.success) { closeModal(); loadTasks(); } else alert(d.message); })
    .catch(() => { setActionLoading(false); alert('서버 오류'); });
}

function setActionLoading(on) {
  document.querySelectorAll('#m-actions .action-btn').forEach(b => { b.disabled = on; b.style.opacity = on ? '0.6' : '1'; });
}

// ===== 대시보드 =====
function updateDashboard() {
  document.getElementById('s-total').textContent = tasks.length;
  document.getElementById('s-done').textContent = tasks.filter(t => t.status === '완료').length;
  document.getElementById('s-active').textContent = tasks.filter(t => t.status === '진행').length;
  document.getElementById('s-wait').textContent = tasks.filter(t => !t.status || t.status === '대기').length;
  const owners = {};
  tasks.forEach(t => {
    if (!owners[t.owner]) owners[t.owner] = { total: 0, done: 0, active: 0 };
    owners[t.owner].total++;
    if (t.status === '완료') owners[t.owner].done++;
    if (t.status === '진행') owners[t.owner].active++;
  });
  document.getElementById('owner-list').innerHTML = Object.entries(owners).map(([name, s]) => {
    const pct = s.total ? Math.round(s.done / s.total * 100) : 0;
    return `<div class="owner-card">
      <div style="flex:1">
        <div class="owner-name">${name}</div>
        <div class="owner-stats-text">${s.done}/${s.total} 완료 · 진행중 ${s.active}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div style="font-size:20px;font-weight:700;color:var(--success);margin-left:16px">${pct}%</div>
    </div>`;
  }).join('');
}

// ===== 탭 전환 =====
function switchTab(tab) {
  document.getElementById('tab-tasks').style.display = tab === 'tasks' ? 'block' : 'none';
  document.getElementById('tab-dashboard').style.display = tab === 'dashboard' ? 'block' : 'none';
  document.getElementById('tab-btn-tasks').classList.toggle('active', tab === 'tasks');
  document.getElementById('tab-btn-dashboard').classList.toggle('active', tab === 'dashboard');
}

// ===== 유틸 =====
function show(id) { document.getElementById(id).classList.add('active'); }
function hide(id) { document.getElementById(id).classList.remove('active'); }
function enc(s) { return encodeURIComponent(s); }
function showErr(el, msg) { el.textContent = msg; el.style.display = 'block'; }

document.getElementById('inp-pin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
