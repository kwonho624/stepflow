<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>StepFlow</title>
<style>
:root{--primary:#4f6ef7;--primary-light:#e8ecff;--success:#22c55e;--success-light:#dcfce7;--warning:#f59e0b;--warning-light:#fef3c7;--danger:#ef4444;--danger-light:#fee2e2;--gray:#6b7280;--gray-light:#f3f4f6;--text:#111827;--text-sub:#6b7280;--border:#e5e7eb;--bg:#f9fafb;--card:#ffffff;--radius:12px;--radius-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Pretendard',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.screen{display:none;flex-direction:column;min-height:100vh;}
.screen.active{display:flex;}

/* 로그인 */
.login-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;background:linear-gradient(160deg,#1a1a2e 0%,#16213e 60%,#0f3460 100%);}
.login-logo{font-size:28px;font-weight:700;color:#fff;margin-bottom:4px;}
.login-logo span{color:var(--primary);}
.login-sub{font-size:14px;color:rgba(255,255,255,0.5);margin-bottom:40px;}
.login-card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;}
.login-label{font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:6px;}
.login-input{width:100%;padding:12px 14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius-sm);font-size:16px;color:#fff;margin-bottom:16px;outline:none;}
.login-input:focus{border-color:var(--primary);}
.login-btn{width:100%;padding:14px;background:var(--primary);border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:600;color:#fff;cursor:pointer;}
.login-btn:active{opacity:0.85;}
.login-error{font-size:13px;color:#fc8181;margin-top:10px;text-align:center;display:none;}

/* 상단바 */
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.topbar h1{font-size:17px;font-weight:700;}
.topbar p{font-size:12px;color:var(--text-sub);margin-top:1px;}
.icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--gray-light);cursor:pointer;font-size:16px;}

/* 콘텐츠 */
.content{flex:1;padding:16px;overflow-y:auto;padding-bottom:80px;}

/* 탭바 */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding:8px 0 env(safe-area-inset-bottom,8px);z-index:20;}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;}
.tab-item .t-icon{font-size:22px;color:var(--text-sub);}
.tab-item .t-label{font-size:10px;color:var(--text-sub);}
.tab-item.active .t-icon,.tab-item.active .t-label{color:var(--primary);}

/* 필터 */
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.chip{white-space:nowrap;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--card);color:var(--text-sub);cursor:pointer;}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}

/* 업무 카드 */
.task-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;}
.task-card:active{box-shadow:0 0 0 2px var(--primary);}
.task-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
.task-name{font-size:15px;font-weight:600;flex:1;margin-right:8px;}
.task-detail{font-size:13px;color:var(--text-sub);margin-bottom:8px;}
.task-meta{display:flex;gap:10px;flex-wrap:wrap;}
.meta-item{font-size:12px;color:var(--text-sub);}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
.badge-wait{background:var(--gray-light);color:var(--gray);}
.badge-active{background:var(--primary-light);color:var(--primary);}
.badge-pause{background:var(--warning-light);color:var(--warning);}
.owner-badge{font-size:11px;background:#f0f0ff;color:var(--primary);padding:2px 8px;border-radius:20px;font-weight:500;}

/* 업무 추가 버튼 */
.add-btn{position:fixed;right:16px;bottom:80px;width:52px;height:52px;border-radius:50%;background:var(--primary);border:none;color:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 12px rgba(79,110,247,0.4);z-index:15;display:flex;align-items:center;justify-content:center;}

/* 통계 */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.stat-label{font-size:12px;color:var(--text-sub);margin-bottom:4px;}
.stat-val{font-size:26px;font-weight:700;}
.stat-box.blue .stat-val{color:var(--primary);}
.stat-box.green .stat-val{color:var(--success);}
.stat-box.yellow .stat-val{color:var(--warning);}
.section-title{font-size:13px;font-weight:600;color:var(--text-sub);margin:16px 0 10px;text-transform:uppercase;letter-spacing:0.5px;}

/* 담당자 카드 */
.owner-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;}
.owner-name{font-size:15px;font-weight:600;margin-bottom:2px;}
.owner-sub{font-size:13px;color:var(--text-sub);}
.progress-bar{height:4px;background:var(--gray-light);border-radius:2px;margin-top:8px;}
.progress-fill{height:100%;background:var(--success);border-radius:2px;}

/* 생산성 테이블 */
.prod-table{width:100%;border-collapse:collapse;font-size:13px;}
.prod-table th{background:var(--gray-light);padding:8px 10px;text-align:left;font-weight:600;font-size:12px;color:var(--text-sub);}
.prod-table td{padding:10px;border-bottom:1px solid var(--border);}
.prod-table tr:last-child td{border-bottom:none;}

/* 공지사항 */
.notice-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;}
.notice-title{font-size:15px;font-weight:600;margin-bottom:4px;}
.notice-time{font-size:13px;color:var(--primary);font-weight:500;}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:flex-end;z-index:100;}
.modal-bg.open{display:flex;}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:88vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,20px);}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
.modal-title{font-size:18px;font-weight:700;margin-bottom:4px;}
.modal-sub{font-size:13px;color:var(--text-sub);margin-bottom:16px;}
.modal-info{background:var(--gray-light);border-radius:var(--radius-sm);padding:12px;margin-bottom:16px;font-size:13px;color:var(--text-sub);line-height:1.7;white-space:pre-line;}
.form-label{font-size:13px;font-weight:500;margin-bottom:6px;}
.form-input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;color:var(--text);background:var(--card);outline:none;margin-bottom:14px;}
.form-input:focus{border-color:var(--primary);}
.action-btn{width:100%;padding:14px;border-radius:var(--radius-sm);font-size:16px;font-weight:600;cursor:pointer;border:none;margin-bottom:8px;}
.btn-start{background:var(--primary);color:#fff;}
.btn-done{background:var(--success);color:#fff;}
.btn-pause{background:var(--warning-light);color:var(--warning);border:1px solid var(--warning);}
.btn-close{background:var(--gray-light);color:var(--text-sub);}
.action-btn:active{opacity:0.8;}
.action-btn:disabled{opacity:0.5;}

/* 카테고리 그리드 */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.cat-btn{padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);font-size:14px;font-weight:500;cursor:pointer;text-align:center;}
.cat-btn.selected{background:var(--primary-light);border-color:var(--primary);color:var(--primary);}
.job-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.job-btn{padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);font-size:14px;cursor:pointer;text-align:left;}
.job-btn.selected{background:var(--primary-light);border-color:var(--primary);color:var(--primary);}

.loading{text-align:center;padding:40px;color:var(--text-sub);font-size:14px;}
.empty{text-align:center;padding:48px 24px;color:var(--text-sub);}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="screen-login" class="screen active">
  <div class="login-wrap">
    <div class="login-logo">Step<span>Flow</span></div>
    <div class="login-sub">생산성 관리 시스템</div>
    <div class="login-card">
      <div class="login-label">이름</div>
      <input id="inp-name" class="login-input" type="text" placeholder="이름 입력" autocomplete="off"/>
      <div class="login-label">핀번호</div>
      <input id="inp-pin" class="login-input" type="password" placeholder="핀번호 입력" inputmode="numeric"/>
      <button class="login-btn" onclick="doLogin()">로그인</button>
      <div id="login-error" class="login-error"></div>
    </div>
  </div>
</div>

<!-- 메인 -->
<div id="screen-main" class="screen">
  <div class="topbar">
    <div>
      <h1>StepFlow</h1>
      <p id="top-user-label"></p>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="icon-btn" onclick="loadAll()">🔄</button>
      <button class="icon-btn" onclick="doLogout()">🚪</button>
    </div>
  </div>

  <!-- 업무목록 탭 -->
  <div id="tab-tasks" class="content">
    <div class="filter-row">
      <div class="chip active" onclick="filterTasks('전체',this)">전체</div>
      <div class="chip" onclick="filterTasks('대기',this)">대기</div>
      <div class="chip" onclick="filterTasks('진행',this)">진행중</div>
      <div class="chip" onclick="filterTasks('일시정지',this)">일시정지</div>
    </div>
    <div id="task-list"><div class="loading">불러오는 중...</div></div>
  </div>

  <!-- 공지사항 탭 -->
  <div id="tab-notice" class="content" style="display:none">
    <div id="notice-list"><div class="loading">불러오는 중...</div></div>
  </div>

  <!-- 대시보드 탭 (관리자만) -->
  <div id="tab-dashboard" class="content" style="display:none">
    <div id="dash-content"><div class="loading">불러오는 중...</div></div>
  </div>

  <!-- 탭바 -->
  <div class="tabbar" id="tabbar">
    <div class="tab-item active" id="tab-btn-tasks" onclick="switchTab('tasks')">
      <span class="t-icon">📋</span><span class="t-label">업무목록</span>
    </div>
    <div class="tab-item" id="tab-btn-notice" onclick="switchTab('notice')">
      <span class="t-icon">📢</span><span class="t-label">공지사항</span>
    </div>
    <div class="tab-item" id="tab-btn-dashboard" onclick="switchTab('dashboard')" style="display:none">
      <span class="t-icon">📊</span><span class="t-label">대시보드</span>
    </div>
  </div>

  <!-- 업무 추가 버튼 -->
  <button class="add-btn" id="add-btn" onclick="openAddModal()">＋</button>
</div>

<!-- 업무 상세 모달 -->
<div id="modal-task-bg" class="modal-bg" onclick="closeModalOutside(event,'modal-task-bg')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="m-name"></div>
    <div class="modal-sub" id="m-detail"></div>
    <div class="modal-info" id="m-info"></div>
    <div id="m-quantity-wrap" style="display:none">
      <div class="form-label">수량</div>
      <input id="m-quantity" class="form-input" type="number" placeholder="처리 수량 입력" inputmode="numeric"/>
    </div>
    <div class="form-label">비고 (선택)</div>
    <input id="m-memo" class="form-input" type="text" placeholder="메모 입력"/>
    <div id="m-actions"></div>
    <button class="action-btn btn-close" onclick="closeModal('modal-task-bg')">닫기</button>
  </div>
</div>

<!-- 업무 추가 모달 -->
<div id="modal-add-bg" class="modal-bg" onclick="closeModalOutside(event,'modal-add-bg')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">업무 추가</div>
    <div class="modal-sub" style="margin-bottom:16px">카테고리를 선택하세요</div>
    <div id="add-step1">
      <div class="cat-grid" id="cat-grid"></div>
    </div>
    <div id="add-step2" style="display:none">
      <button onclick="backToStep1()" style="background:none;border:none;color:var(--primary);font-size:14px;cursor:pointer;margin-bottom:12px;">← 카테고리 다시 선택</button>
      <div class="form-label" id="step2-label">작업내용 선택</div>
      <div class="job-list" id="job-list"></div>
    </div>
    <div id="add-confirm" style="display:none">
      <div class="modal-info" id="add-confirm-info"></div>
      <button class="action-btn btn-start" id="add-confirm-btn" onclick="confirmAddTask()">추가하기</button>
      <button onclick="backToStep2()" style="background:none;border:none;color:var(--primary);font-size:14px;cursor:pointer;width:100%;text-align:center;padding:8px;">← 다시 선택</button>
    </div>
    <button class="action-btn btn-close" onclick="closeModal('modal-add-bg')" style="margin-top:4px">닫기</button>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyRwjLSmzG1rO0szJuwOIMMAKNQ0vthpPBl9DnQGRSflgkzu363_EwdvXoVPst4ut0B/exec';
let user = null, tasks = [], jobCategories = {}, currentFilter = '전체', currentTaskId = null;
let selectedCat = null, selectedJob = null;

// ===== 로그인 =====
function doLogin() {
  const name = document.getElementById('inp-name').value.trim();
  const pin  = document.getElementById('inp-pin').value.trim();
  const err  = document.getElementById('login-error');
  if (!name || !pin) { err.textContent='이름과 핀번호를 입력하세요.'; err.style.display='block'; return; }
  err.style.display='none';
  const btn = document.querySelector('.login-btn');
  btn.textContent='로그인 중...'; btn.disabled=true;
  fetch(`${API}?action=login&name=${enc(name)}&pin=${enc(pin)}`)
    .then(r=>r.json())
    .then(d=>{
      btn.textContent='로그인'; btn.disabled=false;
      if(d.success){
        user=d;
        document.getElementById('top-user-label').textContent = d.role==='관리자' ? `${d.name} · 관리자` : d.name;
        // 관리자만 대시보드 탭 표시
        if(d.role==='관리자'){
          document.getElementById('tab-btn-dashboard').style.display='flex';
        }
        document.getElementById('screen-login').classList.remove('active');
        document.getElementById('screen-main').classList.add('active');
        loadAll();
      } else { err.textContent=d.message||'로그인 실패'; err.style.display='block'; }
    })
    .catch(()=>{ btn.textContent='로그인'; btn.disabled=false; err.textContent='서버 연결 오류'; err.style.display='block'; });
}

function doLogout(){
  if(!confirm('로그아웃 하시겠습니까?')) return;
  user=null; tasks=[];
  document.getElementById('tab-btn-dashboard').style.display='none';
  document.getElementById('screen-main').classList.remove('active');
  document.getElementById('screen-login').classList.add('active');
  document.getElementById('inp-pin').value='';
  switchTab('tasks');
}

function loadAll(){
  loadTasks();
  loadNotice();
  loadJobList();
  if(user.role==='관리자') loadDashboard();
}

// ===== 업무 목록 =====
function loadTasks(){
  document.getElementById('task-list').innerHTML='<div class="loading">불러오는 중...</div>';
  fetch(`${API}?action=getTasks&name=${enc(user.name)}&role=${enc(user.role)}`)
    .then(r=>r.json())
    .then(d=>{ if(d.success){tasks=d.tasks;renderTasks();} else { document.getElementById('task-list').innerHTML=`<div class="loading">${d.message}</div>`; } })
    .catch(()=>{ document.getElementById('task-list').innerHTML='<div class="loading">서버 연결 오류</div>'; });
}

function renderTasks(){
  const list = document.getElementById('task-list');
  const filtered = currentFilter==='전체' ? tasks : tasks.filter(t=>t.status===currentFilter);
  if(!filtered.length){ list.innerHTML='<div class="empty"><div style="font-size:40px;margin-bottom:12px">📭</div><p>해당 업무가 없습니다.</p></div>'; return; }
  list.innerHTML = filtered.map(t=>`
    <div class="task-card" onclick="openTaskModal('${t.taskId}')">
      <div class="task-top">
        <div class="task-name">${t.taskName}</div>
        <span class="badge ${badgeClass(t.status)}">${t.status}</span>
      </div>
      <div class="task-detail">${t.detail||''}</div>
      <div class="task-meta">
        ${user.role==='관리자'?`<span class="owner-badge">${t.owner}</span>`:''}
        ${t.quantity?`<span class="meta-item">📦 ${t.quantity}</span>`:''}
        ${t.accumulated?`<span class="meta-item">⏱ ${t.accumulated}h</span>`:''}
        ${t.startTime?`<span class="meta-item">▶ ${t.startTime}</span>`:''}
      </div>
    </div>`).join('');
}

function badgeClass(s){ return s==='진행'?'badge-active':s==='일시정지'?'badge-pause':'badge-wait'; }

function filterTasks(f,el){
  currentFilter=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

// ===== 공지사항 =====
function loadNotice(){
  document.getElementById('notice-list').innerHTML='<div class="loading">불러오는 중...</div>';
  fetch(`${API}?action=getNotice`)
    .then(r=>r.json())
    .then(d=>{
      if(d.success && d.notices.length){
        document.getElementById('notice-list').innerHTML = d.notices.map(n=>`
          <div class="notice-card">
            <div class="notice-title">${n.title}</div>
            ${n.value?`<div class="notice-time">${n.value}</div>`:''}
          </div>`).join('');
      } else {
        document.getElementById('notice-list').innerHTML='<div class="empty"><div style="font-size:40px;margin-bottom:12px">📭</div><p>공지사항이 없습니다.</p></div>';
      }
    })
    .catch(()=>{ document.getElementById('notice-list').innerHTML='<div class="loading">서버 연결 오류</div>'; });
}

// ===== 대시보드 (관리자) =====
function loadDashboard(){
  document.getElementById('dash-content').innerHTML='<div class="loading">불러오는 중...</div>';
  fetch(`${API}?action=getDashboard`)
    .then(r=>r.json())
    .then(d=>{
      if(!d.success){ document.getElementById('dash-content').innerHTML='<div class="loading">불러오기 실패</div>'; return; }
      const t=d.today;
      let html=`
        <div class="stat-grid">
          <div class="stat-box"><div class="stat-label">오늘 업무</div><div class="stat-val">${t.total}</div></div>
          <div class="stat-box blue"><div class="stat-label">진행중</div><div class="stat-val">${t.active}</div></div>
          <div class="stat-box green"><div class="stat-label">완료</div><div class="stat-val">${t.done}</div></div>
          <div class="stat-box yellow"><div class="stat-label">물량</div><div class="stat-val">${t.quantity}</div></div>
        </div>`;
      if(d.members && d.members.length){
        html+=`<div class="section-title">담당자별 현황</div>`;
        html+=d.members.map(m=>`
          <div class="owner-card">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div class="owner-name">${m.name}</div>
              <span class="badge ${m.state==='완료'?'badge-done':m.state==='진행'?'badge-active':'badge-wait'}">${m.state||'대기'}</span>
            </div>
            <div class="owner-sub">${m.status||''} ${m.detail?'· '+m.detail:''}</div>
          </div>`).join('');
      }
      if(d.productivity && d.productivity.length){
        html+=`<div class="section-title">이달 생산성</div>
          <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;">
          <table class="prod-table">
            <tr><th>업무</th><th>물량</th><th>시간</th><th>UPH</th></tr>
            ${d.productivity.map(p=>`<tr><td>${p.taskName}</td><td>${p.quantity}</td><td>${p.hours}</td><td style="font-weight:600;color:var(--primary)">${p.uph}</td></tr>`).join('')}
          </table></div>`;
      }
      document.getElementById('dash-content').innerHTML=html;
    })
    .catch(()=>{ document.getElementById('dash-content').innerHTML='<div class="loading">서버 연결 오류</div>'; });
}

// ===== 업무 추가 =====
function loadJobList(){
  fetch(`${API}?action=getJobList`)
    .then(r=>r.json())
    .then(d=>{ if(d.success) jobCategories=d.categories; })
    .catch(()=>{});
}

function openAddModal(){
  selectedCat=null; selectedJob=null;
  renderCatGrid();
  document.getElementById('add-step1').style.display='block';
  document.getElementById('add-step2').style.display='none';
  document.getElementById('add-confirm').style.display='none';
  document.getElementById('modal-add-bg').classList.add('open');
}

function renderCatGrid(){
  document.getElementById('cat-grid').innerHTML = Object.keys(jobCategories).map(cat=>`
    <button class="cat-btn" onclick="selectCategory('${cat}')">${cat}</button>`).join('');
}

function selectCategory(cat){
  selectedCat=cat;
  document.getElementById('step2-label').textContent=`[${cat}] 작업내용 선택`;
  document.getElementById('job-list').innerHTML = jobCategories[cat].map(j=>`
    <button class="job-btn" onclick="selectJob('${j.jobNo}','${j.jobName}')">${j.jobNo} · ${j.jobName}</button>`).join('');
  document.getElementById('add-step1').style.display='none';
  document.getElementById('add-step2').style.display='block';
}

function selectJob(jobNo,jobName){
  selectedJob={jobNo,jobName};
  document.getElementById('add-confirm-info').textContent=`업무명: ${jobNo}\n작업내용: ${jobName}\n담당자: ${user.name}`;
  document.getElementById('add-step2').style.display='none';
  document.getElementById('add-confirm').style.display='block';
}

function backToStep1(){ document.getElementById('add-step1').style.display='block'; document.getElementById('add-step2').style.display='none'; }
function backToStep2(){ document.getElementById('add-step2').style.display='block'; document.getElementById('add-confirm').style.display='none'; }

function confirmAddTask(){
  if(!selectedJob) return;
  const btn=document.getElementById('add-confirm-btn');
  btn.textContent='추가 중...'; btn.disabled=true;
  fetch(API,{method:'POST',body:JSON.stringify({action:'addTask',name:user.name,jobNo:selectedJob.jobNo,jobName:selectedJob.jobName})})
    .then(r=>r.json())
    .then(d=>{
      btn.textContent='추가하기'; btn.disabled=false;
      if(d.success){ closeModal('modal-add-bg'); loadTasks(); }
      else alert(d.message);
    })
    .catch(()=>{ btn.textContent='추가하기'; btn.disabled=false; alert('서버 오류'); });
}

// ===== 업무 상세 모달 =====
function openTaskModal(taskId){
  currentTaskId=taskId;
  const t=tasks.find(x=>String(x.taskId)===String(taskId));
  if(!t) return;
  document.getElementById('m-name').textContent=t.taskName;
  document.getElementById('m-detail').textContent=t.detail||'';
  let info=`담당자: ${t.owner}`;
  if(t.startTime) info+=`\n시작: ${t.startTime}`;
  if(t.accumulated) info+=`\n누적 작업시간: ${t.accumulated}h`;
  if(t.quantity) info+=`\n수량: ${t.quantity}`;
  document.getElementById('m-info').textContent=info;
  document.getElementById('m-memo').value=t.memo||'';
  document.getElementById('m-quantity').value='';
  const qw=document.getElementById('m-quantity-wrap');
  const actions=document.getElementById('m-actions');
  const s=t.status;
  if(s==='대기'||s==='일시정지'){
    qw.style.display='none';
    actions.innerHTML=`<button class="action-btn btn-start" onclick="doStart()">▶ 업무 시작</button>`;
  } else if(s==='진행'){
    qw.style.display='block';
    actions.innerHTML=`
      <button class="action-btn btn-done" onclick="doEnd()">✅ 완료</button>
      <button class="action-btn btn-pause" onclick="doPause()">⏸ 일시정지</button>`;
  }
  document.getElementById('modal-task-bg').classList.add('open');
}

function doStart(){
  setLoading(true);
  fetch(API,{method:'POST',body:JSON.stringify({action:'startTask',taskId:currentTaskId})})
    .then(r=>r.json()).then(d=>{setLoading(false);if(d.success){closeModal('modal-task-bg');loadTasks();}else alert(d.message);})
    .catch(()=>{setLoading(false);alert('서버 오류');});
}

function doEnd(){
  const qty=document.getElementById('m-quantity').value;
  const memo=document.getElementById('m-memo').value;
  setLoading(true);
  fetch(API,{method:'POST',body:JSON.stringify({action:'endTask',taskId:currentTaskId,quantity:qty,memo})})
    .then(r=>r.json()).then(d=>{setLoading(false);if(d.success){closeModal('modal-task-bg');loadTasks();}else alert(d.message);})
    .catch(()=>{setLoading(false);alert('서버 오류');});
}

function doPause(){
  setLoading(true);
  fetch(API,{method:'POST',body:JSON.stringify({action:'pauseTask',taskId:currentTaskId})})
    .then(r=>r.json()).then(d=>{setLoading(false);if(d.success){closeModal('modal-task-bg');loadTasks();}else alert(d.message);})
    .catch(()=>{setLoading(false);alert('서버 오류');});
}

function setLoading(on){ document.querySelectorAll('#m-actions .action-btn').forEach(b=>{b.disabled=on;b.style.opacity=on?'0.6':'1';}); }

// ===== 탭 전환 =====
function switchTab(tab){
  ['tasks','notice','dashboard'].forEach(t=>{
    document.getElementById(`tab-${t}`).style.display = t===tab?'block':'none';
    const btn=document.getElementById(`tab-btn-${t}`);
    if(btn) btn.classList.toggle('active',t===tab);
  });
  // 대시보드 탭 전환 시 최신 데이터 로드
  if(tab==='dashboard') loadDashboard();
  // 업무 추가 버튼 업무목록 탭에서만 표시
  document.getElementById('add-btn').style.display = tab==='tasks'?'flex':'none';
}

// ===== 유틸 =====
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function closeModalOutside(e,id){ if(e.target===document.getElementById(id)) closeModal(id); }
function enc(s){ return encodeURIComponent(s); }
document.getElementById('inp-pin').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
